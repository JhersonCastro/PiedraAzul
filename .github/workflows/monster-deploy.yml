name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: |
          dotnet restore PiedraAzul/PiedraAzul/PiedraAzul.csproj
          dotnet restore PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj

      - name: Cache NuGet packages
        uses: actions/cache/save@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/PiedraAzul/PiedraAzul/PiedraAzul.csproj', '**/PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj') }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/PiedraAzul/PiedraAzul/PiedraAzul.csproj', '**/PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj') }}

      - name: Run tests
        run: |
          dotnet test PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj \
            --configuration Release \
            --verbosity normal

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/PiedraAzul/PiedraAzul/PiedraAzul.csproj', '**/PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj') }}

      - name: Publish app
        run: |
          dotnet publish PiedraAzul/PiedraAzul/PiedraAzul.csproj \
            --configuration Release \
            --output ./publish

      - name: Write appsettings.Production.json
        run: echo '${{ secrets.APP_SETTINGS_PRODUCTION }}' > ./publish/appsettings.Production.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish
          retention-days: 3

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./publish

      - name: Take app offline
        run: |
          echo "<h1>Actualizando PiedraAzul...</h1>" > app_offline.htm
          curl -s -T app_offline.htm \
            "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/*.pdb
            **/BlazorDebugProxy/**

      - name: Bring app online
        if: always()
        run: |
          curl -s \
            "ftp://${{ secrets.FTP_SERVER }}" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -Q "DELE /wwwroot/app_offline.htm"

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy a MonsterASP.NET" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ejecutado por | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Servidor | \`site62559.siteasp.net\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | [piedraazul.runasp.net](http://piedraazul.runasp.net) |" >> $GITHUB_STEP_SUMMARY
