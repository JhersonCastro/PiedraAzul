name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────
  #  1. Build, test y publish
  # ──────────────────────────────────────────
  build:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore PiedraAzul/PiedraAzul/PiedraAzul.csproj

      - name: Test
        run: |
          dotnet restore PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj
          dotnet test PiedraAzul/PiedraAzul.Test/PiedraAzul.Test.csproj \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=results.trx"

      - name: Publish
        run: |
          dotnet publish PiedraAzul/PiedraAzul/PiedraAzul.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish

      - name: Write appsettings.Production.json
        run: echo '${{ secrets.APP_SETTINGS_PRODUCTION }}' > ./publish/appsettings.Production.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish
          retention-days: 3

      - name: Build summary
        if: always()
        run: |
          echo "## Build, Test & Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paso | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repositorio | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ejecutado por | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| .NET | 10.x |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pasos" >> $GITHUB_STEP_SUMMARY
          echo "- Restore de dependencias" >> $GITHUB_STEP_SUMMARY
          echo "- Tests ejecutados en Release" >> $GITHUB_STEP_SUMMARY
          echo "- Publish generado en \`./publish\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`appsettings.Production.json\` inyectado desde secreto" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  #  2. Deploy via FTP a MonsterASP.NET
  # ──────────────────────────────────────────
  deploy:
    name: Deploy to MonsterASP.NET
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./publish

      # Sube app_offline.htm para que ASP.NET Core libere los DLLs bloqueados por IIS.
      # Sin esto el FTP falla con error 550 al intentar reemplazar archivos en uso.
      - name: Take app offline
        run: |
          echo "<h1>Actualizando PiedraAzul...</h1>" > app_offline.htm
          curl -s -T app_offline.htm \
            "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/*.pdb
            **/BlazorDebugProxy/**

      # Elimina app_offline.htm para que el sitio vuelva a estar disponible.
      - name: Bring app online
        if: always()
        run: |
          curl -s \
            "ftp://${{ secrets.FTP_SERVER }}" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -Q "DELE /wwwroot/app_offline.htm"

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy a MonsterASP.NET" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Servidor | \`site62559.siteasp.net\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Destino | \`/wwwroot/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | [piedraazul.runasp.net](http://piedraazul.runasp.net) |" >> $GITHUB_STEP_SUMMARY
          echo "| Método | FTP |" >> $GITHUB_STEP_SUMMARY
